services:

  ######################################################
  ## API AND DASHBOARD #################################
  ######################################################

  api:
    build: ./appserver/api/. 
    container_name: ${API_HOST}
    restart: unless-stopped
    volumes:
      - ./appserver/api/app:/app
      - ./appserver/api/storage:/storage
     # - /home/user/PIPES:/hostpipe
      - /app/node_modules
    working_dir: /app
    env_file:
      - ./appserver/api/app/.env
    environment:
      NODE_ENV: development
    ports:
      - "${API_PORT}:3000"
    command: /bin/bash -c "yarn && yarn build && yarn start"
    #command: tail -f /dev/null
    depends_on:
      - ${POSTGRES_DB_HOST}
    networks:
      - homeNetwork
  dashy:
    # To build from source, replace 'image: lissy93/dashy' with 'build: .'
    # build: .
    image: lissy93/dashy
    container_name: ${DASHBOARD_HOST}
    # Pass in your config file below, by specifying the path on your host machine
    volumes:
      - ./dashy/user-data/:/app/user-data/
      - ./dashy/widgets/:/app/src/components/Widgets/
      - ./dashy/custom/:/app/src/custom/
    ports:
      - ${DASHBOARD_PORT}:8080
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: [ 'CMD', 'node', '/app/services/healthcheck' ]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - homeNetwork

  ######################################################
  ## N8N ###############################################
  ######################################################

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PUBLIC_PORT}
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - NODE_FUNCTION_ALLOW_EXTERNAL=moment,lodash,cheerio,myhelpers
      - GENERIC_TIMEZONE=${N8N_GENERIC_TIMEZONE}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_PRUNE_TIMEOUT=604800
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${POSTGRES_DB_HOST}
      - DB_POSTGRESDB_USER=${N8N_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD=${N8N_POSTGRESDB_PASSWORD}
      - EXECUTIONS_PROCESS=queue
      - N8N_EXECUTIONS_TIMEOUT=0
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_DB=0
      - N8N_PAYLOAD_SIZE_MAX=268435456
      - N8N_DATA_TABLES_MAX_SIZE_BYTES=268435456
    env_file:
      - ./n8n/.env
    volumes:
      - ./n8n/n8n-config/.n8n:/home/node/.n8n
      - ./n8n/n8n-function-helpers/dist:/usr/local/lib/node_modules/n8n/node_modules/myhelpers
      - ./firefly_iii/firefly_iii_import:/firefly_imports
    networks:
      - homeNetwork
    depends_on:
      - ${POSTGRES_DB_HOST}

    ######################################################
    ## FIREFLY III #######################################
    ######################################################

  firefly:
    image: fireflyiii/core:latest
    hostname: ${FIREFLY_HOST}
    networks:
      - homeNetwork
    restart: unless-stopped
    volumes:
      - ./firefly_iii/firefly_iii_upload:/var/www/html/storage/upload
    env_file: ./firefly_iii/.env
    ports:
      - '${FIREFLY_PORT}:8080'
    depends_on:
      - ${POSTGRES_DB_HOST}
      - ${REDIS_HOST}

  ######################################################
  ## PAPERLESS #########################################
  ######################################################
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: ${PAPERLESS_HOST}
    restart: unless-stopped
    depends_on:
      - dbhome
      - redis
      - gotenberg
      - tika
    ports:
      - "8000:8000"
    volumes:
      - ./paperless/data:/usr/src/paperless/data
      - ./paperless/media:/usr/src/paperless/media
      - ./paperless/export:/usr/src/paperless/export
      - ${SCANFOLDER}:/usr/src/paperless/consume
      - ${BACKUPFOLDER}:/backup
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBHOST: dbhome
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_TIMEZONE: ${PAPERLESS_TIMEZONE}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE}
      PAPERLESS_OCR_LANGUAGES: ${PAPERLESS_OCR_LANGUAGES}
      PAPERLESS_REDIS_PREFIX: ${PAPERLESS_REDIS_PREFIX}
      PAPERLESS_CONSUMER_RECURSIVE: ${PAPERLESS_CONSUMER_RECURSIVE}
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: ${PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS}
      PAPERLESS_CONSUMER_POLLING: ${PAPERLESS_CONSUMER_POLLING}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      # PAPERLESS_CONSUMER_ENABLE_MAIL: "true"
      # PAPERLESS_CONSUMER_MAIL_IMAP_HOST: "imap.gmail.com"
      # PAPERLESS_CONSUMER_MAIL_IMAP_PORT: "993"
      # PAPERLESS_CONSUMER_MAIL_IMAP_USER: "you@example.com"
      # generate the password here: https://myaccount.google.com/apppasswords
      # PAPERLESS_CONSUMER_MAIL_IMAP_PASSWORD: "your-app-password"
      # PAPERLESS_CONSUMER_MAIL_IMAP_SSL: "true"
      # PAPERLESS_CONSUMER_MAIL_DELETE: "false"
    networks:
      - homeNetwork

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.7
    ports:
      - "${GOTENBERG_PORT}:3000"
    restart: unless-stopped
    # The gotenberg chromium route is used to convert .eml files. We do not
    # want to allow external content like tracking pixels or even javascript.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    environment:
      GOTENBERG_PORT: ${GOTENBERG_PORT}
    networks:
      - homeNetwork
  tika:
    image: docker.io/apache/tika:latest
    restart: unless-stopped
    networks:
      - homeNetwork

  paperless-ai:
    image: clusterzx/paperless-ai
    container_name: paperless-ai
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    environment:
      - PUID=1000
      - PGID=1000
      - PAPERLESS_PORT=${PAPERLESS_PORT:-3000}
      - PAPERLESS_AI_INITIAL_SETUP=yes
      - PAPERLESS_API_URL=http://paperless:8000/api
 # has to be set on initial startup screen     
 #     - PAPERLESS_API_TOKEN=xxxxxxxxxxxxxxxxxxxx 
 #     - PAPERLESS_USERNAME=clusterzx
    ports:
      - "3010:${PAPERLESS_PORT:-3000}"
    volumes:
      - ./paperless/paperless-ai/data:/app/data
    networks:
      - homeNetwork 

  #######################################################
  ##  GROCY #############################################
  #######################################################
  grocy:
    image: lscr.io/linuxserver/grocy:latest
    container_name: grocy
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vienna
    volumes:
      - ./grocy/config:/config
    ports:
      - '${GROCY_PORT}:80'
    networks:
      - homeNetwork
    depends_on:
      - dbhome
    labels:
      - traefik.enable=true
      - traefik.http.routers.grocy.rule=Host(`inventory.example.com`)
      - traefik.http.services.grocy.loadbalancer.server.port=80

  #######################################################
  ##  MEALIE ############################################
  #######################################################

  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: unless-stopped
    ports:
      - "${MEALIE_PORT}:9000" # Change port if needed
    environment:
      - ALLOW_SIGNUP=false
      - BASE_URL=${MEALIE_BASE_URL}
      - DB_ENGINE=postgres
      - POSTGRES_USER=${MEALIE_POSTGRES_USER}
      - POSTGRES_PASSWORD=${MEALIE_POSTGRES_PASSWORD}
      - POSTGRES_SERVER=dbhome
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${MEALIE_POSTGRES_DB}
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_FROM_NAME=Mealie
      - SMTP_FROM_EMAIL=${GENERAL_DATA_EMAIL}
      - SMTP_USER=${GENERAL_DATA_EMAIL}
      - SMTP_PASSWORD=${MEALIE_MAIL_PASSWORD} # generate one here: https://myaccount.google.com/apppasswords
      - SMTP_AUTH_STRATEGY=TLS
      - OPENAI_API_KEY=${GENERAL_DATA_OPENAI_KEY}
      - OPENAI_MODEL=${GENERAL_DATA_OPENAI_MODEL}
    networks:
      - homeNetwork
    depends_on:
      - dbhome
    volumes:
      - ./mealie/data:/app/data

#######################################################
##  JELLYFIN ##########################################
#######################################################
# important! on windows use the native installation, not docker.
# some features in the docker container are broken, if not
