  #######################################################
  ##  DATABASES #########################################
  #######################################################

  dbhome:
    image: pgvector/pgvector:pg18
    container_name: ${POSTGRES_DB_HOST}
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # - ./dbhome/db:/var/lib/postgresql/data
      - ./dbhome/db:/var/lib/postgresql
      - ./dbhome/init:/docker-entrypoint-initdb.d/
      # - ./dbhome/postgresql.conf:/var/lib/postgresql/data/postgresql.conf # use custom configuration if needed
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
      - POSTGRES_USER=${POSTGRES_ADMIN_USER}
    shm_size: 4gb
    networks:
      - homeNetwork
  # redis server used for temporary data storage and cache.
  redis:
    image: "redis:alpine"
    command: redis-server
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redis/redis-data:/data
      - ./redis/redis-conf:/usr/local/etc/redis/redis.conf
    networks:
      - homeNetwork

  #######################################################
  ######  NGINX #########################################
  #######################################################
  nginxautossh:
    build: ./nginx/.    
    container_name: nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/privacy_policies/:/usr/share/nginx/html/privacy_policies
    restart: unless-stopped
    #command: tail -f /dev/null
    networks:
      - homeNetwork      
