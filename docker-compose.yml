#    environment:
#      - GENERIC_TIMEZONE=Europe/Berlin   # adjust as needed
#      - N8N_BASIC_AUTH_ACTIVE=true       # optional (demo security)
#      - N8N_BASIC_AUTH_USER=admin        # optional
